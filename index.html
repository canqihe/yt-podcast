<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Colin的阅读笔记</title>
        <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Space+Mono:wght@400;500&family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@400;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="assets/css/homepage.css" />
    </head>
    <body>
        <div class="bg-mesh"></div>

        <!-- Hero Section -->
        <section class="hero">
            <video
                class="hero-video-bg"
                autoplay
                muted
                playsinline
                loop
                id="heroVideo"
                src="assets/videos/video.mp4"
            ></video>
            <div class="hero-overlay"></div>
            <div class="container">
                <!-- 头像 - 暂时注释，以后需要时启用
            <div class="hero-avatar">
                <img src="assets/images/avatar.jpg" alt="Colin">
            </div>
            -->
                <h1>Colin的<span class="gradient-text">阅读笔记</span></h1>
                <p class="hero-description">
                    这里汇集了来自顶尖播客的精华内容，涵盖人工智能、未来科技、金融投资等领域。
                    每一篇文章都是对深度对话的精心提炼，让知识触手可及。
                </p>
            </div>
        </section>

        <!-- Articles Grid -->
        <section class="articles-section">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title">最新文章</h2>
                    <div class="section-right">
                        <!-- 搜索框 -->
                        <div class="search-container">
                            <div class="search-box">
                                <input
                                    type="text"
                                    class="search-input"
                                    id="searchInput"
                                    placeholder="搜索文章..."
                                />
                                <svg
                                    class="search-icon"
                                    width="16"
                                    height="16"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    xmlns="http://www.w3.org/2000/svg"
                                >
                                    <path
                                        d="M21 21L15 15M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10Z"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    />
                                </svg>
                            </div>
                        </div>
                        <!-- 主题切换按钮 -->
                        <button
                            class="theme-toggle"
                            id="themeToggle"
                            title="切换主题"
                        >
                            <svg
                                class="sun-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <circle
                                    cx="12"
                                    cy="12"
                                    r="5"
                                    stroke="currentColor"
                                    stroke-width="2"
                                />
                                <path
                                    d="M12 2V4M12 20V22M4 12H2M22 12H20M6.34 6.34L4.93 4.93M19.07 19.07L17.66 17.66M6.34 17.66L4.93 19.07M19.07 4.93L17.66 6.34"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                />
                            </svg>
                            <svg
                                class="moon-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <path
                                    d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linejoin="round"
                                />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- 搜索结果提示 -->
                <div
                    class="search-results-info"
                    id="searchResultsInfo"
                    style="display: none"
                ></div>

                <!-- 文章网格容器 - 由 JavaScript 动态填充 -->
                <div class="articles-grid" id="articlesGrid"></div>

                <!-- 分页容器 -->
                <div class="pagination-container" id="paginationContainer">
                    <button class="pagination-btn" id="prevBtn">上一页</button>
                    <div class="page-numbers" id="pageNumbers"></div>
                    <button class="pagination-btn" id="nextBtn">下一页</button>
                </div>

                <!-- 分页信息 -->
                <div
                    class="pagination-info"
                    id="paginationInfo"
                    style="display: none"
                ></div>
            </div>
        </section>

        <!-- Footer -->
        <footer>
            <div class="container">
                <div class="footer-content">
                    <div class="footer-brand">
                        <a href="#" class="footer-logo">
                            <div class="footer-logo-icon">
                                <img src="assets/images/logo.svg" alt="Colin的阅读笔记 logo" />
                            </div>
                            <span class="footer-logo-text">阅读笔记</span>
                        </a>
                        <p>从海量播客内容中提炼价值，让深度洞察触手可及</p>
                    </div>
                    <div class="social-links">
                        <a
                            href="https://x.com/colinx_me"
                            target="_blank"
                            rel="noopener"
                            class="social-link"
                            aria-label="X (Twitter)"
                        >
                            <svg
                                class="social-icon"
                                viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <path
                                    d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"
                                />
                            </svg>
                        </a>
                        <a
                            href="articles/indigo_readlist.html"
                            target="_blank"
                            rel="noopener"
                            class="social-link friend-link"
                            aria-label="Indigo 阅读清单"
                        >
                            <span style="font-size: 20px">📚</span>
                        </a>
                        <a
                            href="rss-feeds.html"
                            target="_blank"
                            rel="noopener"
                            class="social-link friend-link"
                            aria-label="RSS 订阅源"
                        >
                            <svg
                                class="social-icon"
                                viewBox="0 0 24 24"
                                fill="currentColor"
                                xmlns="http://www.w3.org/2000/svg"
                            >
                                <rect
                                    x="0"
                                    y="0"
                                    width="24"
                                    height="24"
                                    fill="none"
                                />
                                <path
                                    d="M6.18 15.64a2.18 2.18 0 0 1 2.18 2.18C8.36 19 7.38 20 6.18 20C5 20 4 19 4 17.82a2.18 2.18 0 0 1 2.18-2.18M4 4.44A15.56 15.56 0 0 1 19.56 20h-2.83A12.73 12.73 0 0 0 4 7.27V4.44m0 5.66a9.9 9.9 0 0 1 9.9 9.9h-2.83A7.07 7.07 0 0 0 4 12.93V10.1z"
                                />
                            </svg>
                        </a>
                    </div>
                </div>
                <div class="footer-bottom">
                    <p>内容精选自 YouTube 播客 · 由 AI 辅助构建</p>
                </div>
            </div>
        </footer>

        <!-- 模块化 JavaScript - 按依赖顺序加载 -->
        <script src="assets/js/modules/articles-data.js"></script>
        <script src="assets/js/modules/articles-renderer.js"></script>
        <script src="assets/js/modules/scroll-animations.js"></script>
        <script src="assets/js/modules/theme-toggle.js"></script>
        <script src="assets/js/modules/articles-list.js"></script>
        <script src="assets/js/homepage.js"></script>
    </body>
</html>
