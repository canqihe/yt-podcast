<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="100" viewBox="0 0 1200 100"
     role="img" aria-labelledby="title desc">
  <title id="title">Topics Covered</title>
  <desc id="desc">Section header for topics covered</desc>

  <defs>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="100" rx="16" fill="#0a0a0b"/>

  <!-- Accent bar -->
  <rect x="48" y="36" width="4" height="28" rx="2" fill="url(#accent-grad)"/>

  <!-- Title -->
  <text x="68" y="58"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="28" font-weight="700" fill="#ffffff"
        letter-spacing="-0.5">Topics Covered</text>

  <!-- Subtle waveform decoration -->
  <g transform="translate(900 20)" opacity="0.15">
    <rect x="0" y="15" width="4" height="30" rx="2" fill="#00d4ff"/>
    <rect x="10" y="5" width="4" height="50" rx="2" fill="#00d4ff"/>
    <rect x="20" y="20" width="4" height="20" rx="2" fill="#00d4ff"/>
    <rect x="30" y="8" width="4" height="44" rx="2" fill="#00d4ff"/>
    <rect x="40" y="18" width="4" height="24" rx="2" fill="#00d4ff"/>
    <rect x="50" y="3" width="4" height="54" rx="2" fill="#00d4ff"/>
    <rect x="60" y="12" width="4" height="36" rx="2" fill="#00d4ff"/>
    <rect x="70" y="22" width="4" height="16" rx="2" fill="#00d4ff"/>
    <rect x="80" y="10" width="4" height="40" rx="2" fill="#00d4ff"/>
  </g>
</svg>
