<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="100" viewBox="0 0 1200 100"
     role="img" aria-labelledby="title desc">
  <title id="title">Design System</title>
  <desc id="desc">Section header for design system</desc>

  <defs>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="100" rx="16" fill="#0a0a0b"/>

  <!-- Accent bar -->
  <rect x="48" y="36" width="4" height="28" rx="2" fill="url(#accent-grad)"/>

  <!-- Title -->
  <text x="68" y="58"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="28" font-weight="700" fill="#ffffff"
        letter-spacing="-0.5">Design System</text>

  <!-- Color swatches decoration -->
  <g transform="translate(920 32)">
    <circle cx="0" cy="0" r="8" fill="#ff6b35"/>
    <circle cx="22" cy="0" r="8" fill="#a855f7"/>
    <circle cx="44" cy="0" r="8" fill="#22c55e"/>
    <circle cx="66" cy="0" r="8" fill="#3b82f6"/>
    <circle cx="88" cy="0" r="8" fill="#f97066"/>
    <circle cx="110" cy="0" r="8" fill="#14b8a6"/>
  </g>
</svg>
