<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">Colin's Reading Notes</title>
  <desc id="desc">270+ deep-read articles from the best AI, finance, and tech podcast conversations</desc>

  <defs>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1e"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="20" fill="#0a0a0b"/>

  <!-- Left: Title block -->
  <g transform="translate(64 56)">
    <!-- Category label -->
    <rect x="0" y="0" width="180" height="28" rx="14" fill="#ff6b35" opacity="0.15"/>
    <text x="90" y="19" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" font-weight="600" fill="#ff6b35"
          letter-spacing="1.5">PODCAST READING NOTES</text>

    <!-- Main title -->
    <text x="0" y="80"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="52" font-weight="800" fill="#ffffff"
          letter-spacing="-1.5">Colin's</text>
    <text x="0" y="135"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="52" font-weight="800" fill="#ffffff"
          letter-spacing="-1.5">Reading Notes</text>

    <!-- Accent underline -->
    <rect x="0" y="152" width="200" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Description -->
    <text x="0" y="190"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" font-weight="400" fill="#a0a0a0"
          letter-spacing="-0.2">270+ deep-read articles from the best</text>
    <text x="0" y="214"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" font-weight="400" fill="#a0a0a0"
          letter-spacing="-0.2">AI, finance, and tech podcast conversations</text>

    <!-- Stats row -->
    <g transform="translate(0 250)">
      <g>
        <text x="0" y="0"
              font-family="'SF Mono', 'Menlo', monospace"
              font-size="32" font-weight="700" fill="#ff6b35">270+</text>
        <text x="0" y="20"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12" fill="#666666" letter-spacing="0.5">ARTICLES</text>
      </g>
      <g transform="translate(120 0)">
        <text x="0" y="0"
              font-family="'SF Mono', 'Menlo', monospace"
              font-size="32" font-weight="700" fill="#00d4ff">18</text>
        <text x="0" y="20"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12" fill="#666666" letter-spacing="0.5">DOMAINS</text>
      </g>
      <g transform="translate(220 0)">
        <text x="0" y="0"
              font-family="'SF Mono', 'Menlo', monospace"
              font-size="32" font-weight="700" fill="#a0a0a0">6</text>
        <text x="0" y="20"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="12" fill="#666666" letter-spacing="0.5">THEMES</text>
      </g>
    </g>
  </g>

  <!-- Right: Waveform + category cards -->
  <g transform="translate(640 0)">

    <!-- Audio waveform visualization — compact, centered in right panel -->
    <g transform="translate(20 60)" opacity="0.5">
      <rect x="0" y="50" width="5" height="50" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="12" y="30" width="5" height="90" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="24" y="15" width="5" height="120" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="36" y="40" width="5" height="70" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="48" y="25" width="5" height="100" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="60" y="45" width="5" height="60" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="72" y="10" width="5" height="130" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="84" y="35" width="5" height="80" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="96" y="28" width="5" height="95" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="108" y="50" width="5" height="50" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="120" y="18" width="5" height="115" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="132" y="40" width="5" height="70" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="144" y="32" width="5" height="85" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="156" y="52" width="5" height="45" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="168" y="22" width="5" height="105" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="180" y="45" width="5" height="60" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="192" y="15" width="5" height="120" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="204" y="35" width="5" height="80" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="216" y="28" width="5" height="95" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="228" y="50" width="5" height="50" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="240" y="10" width="5" height="130" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="252" y="40" width="5" height="70" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="264" y="32" width="5" height="85" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="276" y="52" width="5" height="45" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="288" y="18" width="5" height="115" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="300" y="45" width="5" height="60" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="312" y="25" width="5" height="100" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="324" y="38" width="5" height="75" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="336" y="12" width="5" height="125" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="348" y="42" width="5" height="65" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="360" y="30" width="5" height="90" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="372" y="50" width="5" height="50" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="384" y="20" width="5" height="110" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="396" y="35" width="5" height="80" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="408" y="45" width="5" height="60" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="420" y="15" width="5" height="120" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="432" y="38" width="5" height="75" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="444" y="28" width="5" height="95" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="456" y="50" width="5" height="50" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="468" y="12" width="5" height="125" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="480" y="42" width="5" height="65" rx="2.5" fill="url(#wave-grad)"/>
      <rect x="492" y="30" width="5" height="90" rx="2.5" fill="url(#wave-grad)"/>
    </g>

    <!-- Category preview cards — 2 rows -->
    <g transform="translate(10 230)">
      <!-- Row 1 -->
      <g transform="translate(0 0)">
        <rect width="150" height="52" rx="10" fill="url(#card-bg)" stroke="#2a2a2e" stroke-width="1"/>
        <circle cx="22" cy="26" r="4" fill="#ff6b35"/>
        <text x="36" y="23"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="13" font-weight="600" fill="#ffffff">AI Strategy</text>
        <text x="36" y="40"
              font-family="'SF Mono', 'Menlo', monospace"
              font-size="10" fill="#666666">OpenAI · Anthropic</text>
      </g>
      <g transform="translate(162 0)">
        <rect width="150" height="52" rx="10" fill="url(#card-bg)" stroke="#2a2a2e" stroke-width="1"/>
        <circle cx="22" cy="26" r="4" fill="#00d4ff"/>
        <text x="36" y="23"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="13" font-weight="600" fill="#ffffff">Finance</text>
        <text x="36" y="40"
              font-family="'SF Mono', 'Menlo', monospace"
              font-size="10" fill="#666666">Druckenmiller · Marks</text>
      </g>
      <g transform="translate(324 0)">
        <rect width="150" height="52" rx="10" fill="url(#card-bg)" stroke="#2a2a2e" stroke-width="1"/>
        <circle cx="22" cy="26" r="4" fill="#a0a0a0"/>
        <text x="36" y="23"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              font-size="13" font-weight="600" fill="#ffffff">Robotics</text>
        <text x="36" y="40"
              font-family="'SF Mono', 'Menlo', monospace"
              font-size="10" fill="#666666">Figure · Unitree</text>
      </g>
    </g>
  </g>
</svg>
