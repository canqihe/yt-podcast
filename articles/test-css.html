<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CSS Test</title>
    <link rel="stylesheet" href="../design-system/design-tokens.css">
    <link rel="stylesheet" href="../design-system/article-styles.css">
    <style>
        :root {
            --accent-primary: #ff6b35;
            --accent-secondary: #00d4ff;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="badge-wrapper animate-in">
                    <span class="badge">测试</span>
                </div>
                <h1 class="title">
                    <span class="title-line-1 animate-in delay-1">测试标题</span>
                    <span class="title-line-2 animate-in delay-2">测试副标题</span>
                </h1>
                <p class="subtitle animate-in delay-3">这是测试内容</p>
                <div class="meta-grid animate-in delay-4">
                    <div class="meta-item">
                        <div class="meta-label">主持人</div>
                        <div class="meta-value">测试主持人</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">嘉宾</div>
                        <div class="meta-value">测试嘉宾</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">时长</div>
                        <div class="meta-value">约 60 分钟</div>
                    </div>
                </div>
                <a href="#" class="cta-button">测试按钮</a>
            </div>
        </div>
    </header>
</body>
</html>
