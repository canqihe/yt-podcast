<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>外部CSS测试</title>
    <link rel="stylesheet" href="../design-system/design-tokens.css">
    <link rel="stylesheet" href="../design-system/article-styles.css">
    <style>
        :root {
            --accent-primary: #ff6b35;
            --accent-secondary: #00d4ff;
            --accent-primary-rgb: 255, 107, 53;
            --accent-secondary-rgb: 0, 212, 255;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="badge-wrapper">
                    <span class="badge">测试分类</span>
                </div>
                <h1 class="title">
                    <span class="title-line-1">这是测试标题第一行</span>
                    <span class="title-line-2">这是测试标题第二行渐变</span>
                </h1>
                <p class="subtitle">这是测试副标题，应该显示为灰色文字。</p>
                <div class="meta-grid">
                    <div class="meta-item">
                        <div class="meta-label">主持人</div>
                        <div class="meta-value">测试主持人</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">嘉宾</div>
                        <div class="meta-value">测试嘉宾</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">时长</div>
                        <div class="meta-value">约 60 分钟</div>
                    </div>
                </div>
                <a href="#" class="cta-button">测试按钮</a>
            </div>
        </div>
    </header>
</body>
</html>
